framework: "net10.0"
owner: "milkmansson"
overview: "Browse a library as a tree of tags, dates, folders and any metadata"
description: >
  Adds a "Tag Browser" channel that shows a library as a folder tree.
  Tags are split on a separator (default ":") into nested folders, so
  "holiday: beach" appears under holiday > beach. Optional branches by date and
  library folder, and by any chosen Jellyfin property: genres, studios,
  production year, rating, people by role (for example directors), or what is
  in the file (video codec, audio language). Any branch can also be promoted
  to a channel of its own, and the main channel can be hidden. Videos only.
category: "General"
artifacts:
  - "Jellyfin.Plugin.TagBrowser.dll"
changelog: >
  Documentation update: a diagram of how the library maps to the channel,
  clearer notes on tags, metadata and file properties, and a complete NFO
  example. No functional changes.
