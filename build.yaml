overview: "Browse your library as a tree of tags, dates and folders"
description: >
  Adds a "Tag Browser" channel that shows your library as a folder tree.
  Tags are split on a separator (default ":") into nested folders, so
  "move: cambre" appears under move > cambre. Optional branches by date,
  library folder, genre, studio and people. Videos only.
