version: "0.2.0.0"
targetAbi: "12.4.0.0"
framework: "net10.0"
owner: "milkmansson"
overview: "Browse your library as a tree of tags, dates, folders and any metadata"
description: >
  Adds a "Tag Browser" channel that shows your library as a folder tree.
  Tags are split on a separator (default ":") into nested folders, so
  "move: cambre" appears under move > cambre. Optional branches by date and
  library folder, and by any Jellyfin property you choose: genres, studios,
  production year, rating, people by role (for example directors), or what is
  in the file (video codec, audio language). Any branch can also be promoted
  to a channel of its own, and the main channel can be hidden. Videos only.
category: "General"
artifacts:
  - "Jellyfin.Plugin.TagBrowser.dll"
changelog: >
  Group by any Jellyfin property, person role or stream property, with an
  Unknown folder for videos without a value. Turn the main channel off and
  promote branches to channels of their own. TV episodes use their series'
  values. Replaces the fixed Genres, Studios and People branches: add them
  as property branches instead.
